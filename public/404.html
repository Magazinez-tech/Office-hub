<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ไม่พบหน้านี้ · Office Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap">
  <style>
    :root{--bg:#ffe6da;--bg2:#ffc6d4;--card:#fffaf7;--ink:#4b3540;--ink-soft:#8c7080;--accent:#ff7fa3;--accent-ink:#fff;--line:#f3d6de}
    @media (prefers-color-scheme: dark){:root{--bg:#181b40;--bg2:#3b2c60;--card:#241e3e;--ink:#f7eaf1;--ink-soft:#c4b3d3;--accent:#ff9cbc;--accent-ink:#2b1a26;--line:#463a68;color-scheme:dark}}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));
      background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
    main{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
    .big{font-family:"Mali",system-ui,sans-serif;font-size:3.4rem;font-weight:700;line-height:1;color:var(--accent)}
    h1{margin:0;font-family:"Mali",system-ui,sans-serif;font-size:1.35rem}
    p{margin:0;color:var(--ink-soft);line-height:1.6}
    a{margin-top:6px;display:inline-block;padding:10px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:500;text-decoration:none}
    a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="big" aria-hidden="true">404</span>
    <h1>ไม่พบหน้านี้ในออฟฟิศ</h1>
    <p>ลิงก์อาจพิมพ์ผิดหรือถูกย้ายไปแล้ว กลับไปที่ห้องหลักได้เลย</p>
    <a href="/">กลับไปที่ Office Hub</a>
  </main>
</body>
</html>
